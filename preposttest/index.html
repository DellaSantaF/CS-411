<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Magnus effect pre-test assessment" />
    <title>Magnus Lab / Pre-test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="../prototype/index.html" aria-label="Magnus Lab home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          MAGNUS LAB
        </a>
        <div class="status-pill"><span class="status-dot"></span> PRE-TEST</div>
      </header>

      <section class="intro">
        <div>
          <p class="eyebrow">MAGNUS EFFECT / DIAGNOSTIC</p>
          <h1>What do you<br /><em>already know?</em></h1>
        </div>
        <p class="intro-copy">Answer five questions to help us understand your starting point. Work from your current understanding; this is not graded.</p>
      </section>

      <section class="assessment" aria-labelledby="question-title">
        <div class="progress-row">
          <span id="step-label">TASK 1 / 5</span>
          <span id="progress-label">20% COMPLETE</span>
        </div>
        <div class="progress-track"><span id="progress-bar"></span></div>

        <form id="assessment-form" name="magnus-pretest" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" novalidate>
          <input type="hidden" name="form-name" value="magnus-pretest" />
          <input type="hidden" name="bot-field" />
          <input type="hidden" name="task_1" />
          <input type="hidden" name="task_2" />
          <input type="hidden" name="task_3" />
          <input type="hidden" name="task_4" />
          <input type="hidden" name="task_5" />
          <div id="question-content"></div>
          <p class="error-message" id="error-message" role="alert"></p>
          <button class="continue-button" id="continue-button" type="submit">
            <span id="button-label">CONFIRM ANSWER</span><span class="button-arrow" aria-hidden="true">→</span>
          </button>
        </form>
      </section>

      <footer>
        <span>INTERACTIVE PHYSICS</span>
        <span>ONE QUESTION AT A TIME</span>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
